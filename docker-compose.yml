name: nhom4-adaptive-model-updating

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: redpanda

    command:
      - redpanda
      - start

      # Kafka API listeners
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092

      # Addresses advertised to Kafka clients
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

      # Internal RPC communication
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145

      # Development configuration
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      # Kafka API accessible from host machine
      - "19092:19092"

      # Redpanda Admin API
      - "19644:9644"

    volumes:
      # Persist Redpanda data
      - redpanda_data:/var/lib/redpanda/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health --exit-when-healthy
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  
  # con voi lưu các thông tin về các mô hình đã được huấn luyện, 
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      retries: 10

  # quản lý trực quan (hem cần thiết lắm, nhưng có thể dùng để debug)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mlflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    
  # minio: lưu trữ các artifacts
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

# minio-init: tạo bucket mlflow nếu chưa tồn tại
  minio-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket mlflow 2>/dev/null; then
          echo "Bucket mlflow already exists. Skipping creation."
        else
          echo "Creating bucket mlflow..."
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket mlflow
        fi
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1

# mLflow: Luồng quản lý các mô hình, lưu trữ các artifacts
  mlflow:
    build: ./infra/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mlflow:5000"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
    
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://mlflow/
      --serve-artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  api:
    build:
        context: .
        dockerfile: serving/Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-BreastCancerRandomForest}
    ports:
      - "8000:8000"

volumes:
  pgdata: 
  pgadmin_data:
  miniodata:
  redpanda_data: