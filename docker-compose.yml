name: nhom4-adaptive-model-updating

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: redpanda

    command:
      - redpanda
      - start

      # Kafka API listeners
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092

      # Addresses advertised to Kafka clients
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092

      # Internal RPC communication
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145

      # Development configuration
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      # Kafka API accessible from host machine
      - "19092:19092"

      # Redpanda Admin API
      - "19644:9644"

    volumes:
      # Persist Redpanda data
      - redpanda_data:/var/lib/redpanda/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health --exit-when-healthy
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  redpanda_data:
